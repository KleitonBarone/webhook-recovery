services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_DB: ${DB_NAME:?required}
    ports:
      - "127.0.0.1:${DB_PORT:-0}:5432"
    volumes:
      - data:/var/lib/postgresql
    labels:
      recovery.run: ${LAB_RUN:?required}
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  data:
    labels:
      recovery.run: ${LAB_RUN:?required}
networks:
  default:
    labels:
      recovery.run: ${LAB_RUN:?required}
    ipam:
      config:
        - subnet: ${LAB_SUBNET:?required}
