name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm browser:install --with-deps
      - run: pnpm check
      - run: pnpm verify:demo
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          path: .local/reports
          retention-days: 3
